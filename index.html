<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السيدة | قريبًا</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#5a2a82,#8e44ad);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
padding:20px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
padding:50px;
border-radius:25px;
max-width:700px;
width:100%;
box-shadow:0 20px 50px rgba(0,0,0,.3);
}

h1{
font-size:55px;
margin-bottom:15px;
}

p{
font-size:22px;
line-height:1.8;
opacity:.9;
}

.btn{
display:inline-block;
margin-top:35px;
padding:15px 35px;
background:white;
color:#5a2a82;
text-decoration:none;
border-radius:50px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}
</style>

</head>

<body>

<div class="card">

<h1>السيدة</h1>

<p>
منصة عربية تهتم بكل ما يخص المرأة.
</p>

<p style="margin-top:15px;">
🚀 قريبًا...
</p>

<a class="btn" href="#">
الموقع قيد الإنشاء
</a>

</div>

</body>
</html>
